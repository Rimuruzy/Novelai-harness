name: Android Release

# 手动触发或构建文件/版本号变动时触发，产出 release APK artifact。
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/android-release.yml"
      - "pubspec.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      # 安卓构建需要 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 与上游 release.yml 保持同一 beta 版 Flutter，匹配 sdk: ^3.12.0-beta
      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: 3.44.0-0.3.pre
          channel: beta
          cache: true

      - name: Build APK
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novelai-harness-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
